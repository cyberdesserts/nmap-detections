# Two virtual hosts on one address and port. The default has HTTP/2 off; the
# named one has it on. A scan by IP sends no server name and so reaches the
# default, which is why scanning by IP can clear a host whose other names are
# exposed. app.example.com is a documentation name (RFC 2606) and never needs
# to resolve: NGINX picks the server block from the TLS server name extension.
server {
    listen 443 ssl default_server;
    http2 off;
    server_name _;
    server_tokens on;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location / { return 200 "case10 default vhost, h2 off\n"; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;
    server_tokens on;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location / { return 200 "case10 app.example.com, h2 on\n"; }
}
