# Same as case 1 in every respect the check can see: affected 1.31.8, TLS,
# HTTP/2 on. The difference is that this one proxies to a backend, which is
# one of the two further conditions CVE-2026-123633 needs.
#
# The check returns the same result for this case as for case 1, because
# proxying is not visible to a client. That is why CVE-2026-123633 is
# reported UNKNOWN rather than LIKELY VULNERABLE.
server {
    listen 127.0.0.1:8081;
    server_tokens on;
    location / { return 200 "case11 backend\n"; }
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens on;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location / { proxy_pass http://127.0.0.1:8081; }
}
