# Lab for nse/http-vuln-cve2026-123007.nse
# Binds to 127.0.0.1 only. Every nginx here is deliberately vulnerable:
# do not expose these ports to a network.
#
# Run ./gen-cert.sh once before the first `docker compose up -d`.

x-nginx: &nginx
  restart: "no"

services:
  case1:   # 1.31.8, HTTP/2 on over TLS          -> LIKELY VULNERABLE
    <<: *nginx
    image: nginx:1.31.8
    ports: ["127.0.0.1:8441:443"]
    volumes: ["./certs:/certs:ro", "./conf/case1.conf:/etc/nginx/conf.d/default.conf:ro"]

  case2:   # 1.31.9 (fixed mainline), HTTP/2 on  -> NOT VULNERABLE
    <<: *nginx
    image: nginx:1.31.9
    ports: ["127.0.0.1:8442:443"]
    volumes: ["./certs:/certs:ro", "./conf/case2.conf:/etc/nginx/conf.d/default.conf:ro"]

  case3:   # 1.31.8, HTTP/2 off                  -> NOT VULNERABLE (the differentiator)
    <<: *nginx
    image: nginx:1.31.8
    ports: ["127.0.0.1:8443:443"]
    volumes: ["./certs:/certs:ro", "./conf/case3.conf:/etc/nginx/conf.d/default.conf:ro"]

  case4:   # 1.31.8, HTTP/2 on, server_tokens off -> UNKNOWN
    <<: *nginx
    image: nginx:1.31.8
    ports: ["127.0.0.1:8444:443"]
    volumes: ["./certs:/certs:ro", "./conf/case4.conf:/etc/nginx/conf.d/default.conf:ro"]

  case5:   # 1.30.6 (last vulnerable stable)     -> LIKELY VULNERABLE
    <<: *nginx
    image: nginx:1.30.6
    ports: ["127.0.0.1:8445:443"]
    volumes: ["./certs:/certs:ro", "./conf/case5.conf:/etc/nginx/conf.d/default.conf:ro"]

  case6:   # 1.30.7 (fixed stable)               -> NOT VULNERABLE
    <<: *nginx
    image: nginx:1.30.7
    ports: ["127.0.0.1:8446:443"]
    volumes: ["./certs:/certs:ro", "./conf/case6.conf:/etc/nginx/conf.d/default.conf:ro"]

  case7:   # 1.31.8, cleartext, http2 on (h2c)   -> UNTESTED, see README
    <<: *nginx
    image: nginx:1.31.8
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./conf/case7.conf:/etc/nginx/conf.d/default.conf:ro"]

  case8:   # 1.31.8, ECDHE AEAD ciphers only     -> LIKELY VULNERABLE
    <<: *nginx
    image: nginx:1.31.8
    ports: ["127.0.0.1:8448:443"]
    volumes: ["./certs:/certs:ro", "./conf/case8.conf:/etc/nginx/conf.d/default.conf:ro"]

  case9:   # 1.31.8, TLS 1.3 only                -> UNKNOWN (ALPN not visible)
    <<: *nginx
    image: nginx:1.31.8
    ports: ["127.0.0.1:8449:443"]
    volumes: ["./certs:/certs:ro", "./conf/case9.conf:/etc/nginx/conf.d/default.conf:ro"]

  case10:  # 1.31.8, two vhosts on one port       -> depends on the server name sent
    <<: *nginx
    image: nginx:1.31.8
    ports: ["127.0.0.1:8450:443"]
    volumes: ["./certs:/certs:ro", "./conf/case10.conf:/etc/nginx/conf.d/default.conf:ro"]
