name: lab

# Runs every check against every lab and fails if any case does not match its
# cases file. Four things are proved:
#   1. the published check still passes the nginx2root lab
#   2. -Pn changes no result, which the README's advice rests on
#   3. the template still agrees with the published check on that same lab
#   4. the template still passes its own four-case skeleton
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nmap
        run: sudo apt-get update && sudo apt-get install -y nmap

      - name: Record versions
        run: |
          nmap --version | head -1
          python3 --version
          docker --version
          docker compose version

      - name: Generate the lab certificate
        working-directory: lab/nginx2root
        run: ./gen-cert.sh

      - name: Start the nginx2root lab
        working-directory: lab/nginx2root
        run: |
          docker compose up -d
          docker compose ps

      - name: Check the script against the nginx2root lab
        run: lab/run-tests.sh nse/http-vuln-cve2026-123007.nse lab/nginx2root/cases.tsv

      - name: Check that -Pn changes no result
        run: lab/check-pn.sh nse/http-vuln-cve2026-123007.nse lab/nginx2root/cases.tsv

      - name: Check the template against the nginx2root lab
        run: lab/run-tests.sh templates/http-vuln-version-condition.nse lab/nginx2root/cases.tsv

      - name: Stop the nginx2root lab
        if: always()
        working-directory: lab/nginx2root
        run: docker compose down

      - name: Start the template lab
        working-directory: templates/lab
        run: |
          docker compose up -d
          docker compose ps

      - name: Check the template against its own lab
        run: lab/run-tests.sh templates/http-vuln-version-condition.nse templates/lab/cases.tsv

      - name: Stop the template lab
        if: always()
        working-directory: templates/lab
        run: docker compose down
